<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phishing Awareness Lab</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 40px 15px;
}

.card {
    background: #1e293b;
    max-width: 400px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px #38bdf8;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 6px;
    border: none;
}

button {
    background: #0ea5e9;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 7px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

<h1>Security Awareness Lab</h1>

<p>Demonstration of how fake pages can deceive users.</p>

<input type="text" placeholder="Demo username">

<input type="password" placeholder="Demo password">

<button onclick="simulation()">Continue</button>

<div id="result"></div>

</div>

<script>

function simulation() {

    document.getElementById("result").innerHTML = `
    <h2 style="color:#facc15">⚠ Simulation!</h2>

    <p>This was a cybersecurity demonstration.</p>

    <p>Real phishing pages may attempt to steal
    credentials or personal information.</p>

    <p><b>Never enter passwords into untrusted links.</b></p>
    `;

}

</script>

</body>
</html>
