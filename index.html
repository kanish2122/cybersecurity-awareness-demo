<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Awareness</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: #1e293b;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px #0ea5e9;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0284c7;
        }

        #result {
            margin-top: 20px;
            color: #facc15;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🛡️ Cybersecurity Awareness</h1>

        <p>Learn how suspicious links can put your personal information at risk.</p>

        <button onclick="demo()">Start Simulation</button>

        <div id="result"></div>
    </div>

    <script>
        function demo() {
            document.getElementById("result").innerHTML =
                "<h2>Simulation Completed!</h2>" +
                "<p>Always verify links before opening them.</p>" +
                "<p>Never share passwords or OTPs with suspicious websites.</p>";
        }
    </script>

</body>
</html>
